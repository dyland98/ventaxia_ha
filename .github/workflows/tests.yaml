name: Test Suite
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install -r requirements_test.txt
      - run: python scripts/check_release.py
      - run: pytest --disable-socket --allow-unix-socket tests
